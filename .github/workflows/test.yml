name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Detect which source files changed ──────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      common:       ${{ steps.filter.outputs.common }}
      features:     ${{ steps.filter.outputs.features }}
      deps:         ${{ steps.filter.outputs.deps }}
      config:       ${{ steps.filter.outputs.config }}
      install:      ${{ steps.filter.outputs.install }}
      theme:        ${{ steps.filter.outputs.theme }}
      migrate_path: ${{ steps.filter.outputs.migrate_path }}
      infra:        ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            common:
              - 'scripts/install/common.sh'
              - 'tests/common.bats'
            features:
              - 'scripts/install/features.sh'
              - 'tests/features.bats'
            deps:
              - 'scripts/install/deps.sh'
              - 'tests/deps.bats'
            config:
              - 'scripts/install/config.sh'
              - 'tests/config.bats'
            install:
              - 'install.sh'
              - 'tests/install.bats'
            starship:
              - 'config/starship.toml'
              - 'tests/starship.bats'
            migrate_path:
              - 'scripts/migrate_path.sh'
              - 'tests/migrate_path.bats'
            infra:
              - 'tests/helpers/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/test.yml'

  # ── Reusable setup & test steps via matrix ─────────────────────
  test-common:
    needs: changes
    if: ${{ needs.changes.outputs.common == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec bats tests/common.bats

  test-features:
    needs: changes
    if: ${{ needs.changes.outputs.features == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec bats tests/features.bats

  test-deps:
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec bats tests/deps.bats

  test-config:
