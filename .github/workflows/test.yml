name: Test

on:
  push:
    branches: [ main ]
  # No branch filter: stacked PRs target other PR branches, not main.
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install starship (for the config warning test)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sS https://starship.rs/install.sh | sh -s -- -y -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm install
      - name: Syntax check
        run: |
          for f in config/*/*.zsh zshrc.template; do zsh -n "$f"; done
          for f in install.sh scripts/*.sh scripts/install/*.sh; do bash -n "$f"; done
      - run: pnpm test

  test-wsl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup WSL
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04
      - name: Install dependencies and run tests in WSL
        shell: wsl-bash {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git unzip zsh
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo npm install -g pnpm@10
          pnpm install
          for f in config/*/*.zsh zshrc.template; do zsh -n "$f"; done
          pnpm test
