    if: ${{ needs.changes.outputs.config == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec bats tests/config.bats

  test-install:
    needs: changes
    if: ${{ needs.changes.outputs.install == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec bats tests/install.bats

  test-starship:
    needs: changes
    if: ${{ needs.changes.outputs.starship == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec bats tests/starship.bats

  test-migrate-path:
    needs: changes
    if: ${{ needs.changes.outputs.migrate_path == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm exec bats tests/migrate_path.bats

  # ── Windows (WSL) — split per test, only when relevant ──────
  test-windows-common:
    needs: changes
    if: ${{ needs.changes.outputs.common == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup WSL
        uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04
      - name: Install dependencies and run tests in WSL
        shell: wsl-bash {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git unzip
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo npm install -g pnpm@10
          pnpm install
          pnpm exec bats tests/common.bats

  test-windows-features:
